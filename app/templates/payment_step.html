<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment | Parvi Studio</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #ffffff; color: #000000; }
        .summary-box { background-color: #fcfbf9; border: 1px solid #eae9e6; padding: 30px; }
        .btn-checkout { background-color: #000; color: #fff; border-radius: 0; padding: 15px; width: 100%; letter-spacing: 2px; font-weight: bold; text-transform: uppercase; border: none; }
        .btn-checkout:hover { background-color: #333; }
    </style>
</head>
<body>

    <main class="container my-5 py-5">
        <div class="row g-5">
            
            <!-- 💳 LEFT COLUMN: LIVE EXTRACTED QR CODE & PAYMENT SELECTION -->
            <div class="col-lg-7">
                <h3 class="fs-5 text-uppercase mb-4" style="letter-spacing: 1px;">Select Payment Method</h3>
                
                <form method="POST">
                    {% csrf_token %}
                    <!-- यह छिपी हुई की व्यू को बताएगी कि यह फाइनल स्टेज 2 है -->
                    <input type="hidden" name="payment_submit" value="1">

                    <div class="mb-4 p-3 border">
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="payment_method" id="pay_online" value="ONLINE" checked onclick="togglePaymentBox('online')">
                            <label class="form-check-label fw-medium text-dark" for="pay_online">Online QR Payment (Instant Confirmation)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="payment_method" id="pay_cod" value="COD" onclick="togglePaymentBox('cod')">
                            <label class="form-check-label fw-medium text-dark" for="pay_cod">Cash on Delivery (COD)</label>
                        </div>
                    </div>

                    <!-- जादुई डिब्बा: जो सीधे ₹310 का असली वर्किंग क्यूआर कोड स्क्रीन पर लोड करेगा -->
                    <div id="qr_payment_container" class="text-center p-4 border bg-light mb-4">
                        <div class="fs-5 fw-bold mb-3 text-dark text-uppercase" style="letter-spacing: 1px;">
                            SCAN TO PAY ₹ {{ total }}
                        </div>
                        
                        {% if secure_qr_image %}
                            <img src="{{ secure_qr_image }}" alt="UPI QR Code" class="img-fluid border p-2 bg-white mb-4" style="max-width: 250px;">
                        {% endif %}

                        <div class="text-start mt-2">
                            <label class="small text-danger fw-semibold mb-1">TRANSACTION ID / UTR NUMBER *</label>
                            <input type="text" name="transaction_id" id="utr_field" class="form-control rounded-0 text-center fw-bold fs-6" placeholder="Enter 12-digit UTR Number" maxlength="12">
                            <span class="text-muted d-block mt-1" style="font-size: 11px;">* पेमेंट करने के बाद PhonePe/GPay से 12 अंकों का UTR नंबर यहाँ दर्ज करना अनिवार्य है।</span>
                        </div>
                    </div>

                    <button type="submit" class="btn-checkout">Place Order</button>
                </form>
            </div>

            <!-- 📋 RIGHT COLUMN: FIXED FINAL FINAL RECEIPT -->
            <div class="col-lg-5">
                <div class="summary-box sticky-top" style="top: 100px;">
                    <h4 class="fs-6 fw-bold text-uppercase mb-4" style="letter-spacing: 1px;">Order Review</h4>
                    
                    <div class="d-flex justify-content-between mb-2 small text-muted">
                        <span>Subtotal</span>
                        <span>₹ {{ subtotal }}</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3 small text-muted">
                        <span>Shipping Charge</span>
                        <span>₹ {{ shipping }}</span> <!-- बिल्कुल फिक्स ₹110 दिखेगा -->
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-0 fw-bold fs-5 text-dark">
                        <span>Total Paid Bill</span>
                        <span>₹ {{ total }}</span> <!-- बिल्कुल फिक्स ₹310.00 लॉक रहेगा -->
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- लाइव डिब्बा छुपाने का स्क्रिप्ट लॉजिक -->
    <script>
        function togglePaymentBox(mode) {
            var qrBox = document.getElementById("qr_payment_container");
            var utrInput = document.getElementById("utr_field");
            if (mode === 'cod') {
                qrBox.style.display = "none";
                if(utrInput) utrInput.removeAttribute('required');
            } else {
                qrBox.style.display = "block";
                if(utrInput) utrInput.setAttribute('required', 'required');
            }
        }
        // शुरू में UTR को रिक्वायर्ड रखें
        document.getElementById("utr_field").setAttribute('required', 'required');
    </script>
</body>
</html>
